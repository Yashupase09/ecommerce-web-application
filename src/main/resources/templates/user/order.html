<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

	<section>

		<div class="container mt-5 p-5">
	<form action="/user/save-order" method="post" id="orders" novalidate>
			<div class="row">

				<div class="col-md-6">

					
						<div class="mb-3 row">
							<p class="text-center fs-2">Delivery Address</p>
							<hr>
							<div class="col p-1">
								<label>First Name</label> <input type="text" name="firstName" required
									class="form-control mt-1">
							</div>

							<div class="col p-1">
								<label>Last Name</label> <input type="text" name="lastName" required
									class="form-control col mt-1">

							</div>
						</div>

						<div class="mb-3 row">
							<div class="col p-1">
								<label>Email</label> <input type="email" name="email" required
									class="form-control mt-1">
							</div>

							<div class="col p-1">
								<label>Mobile Number</label> <input type="number" required
									name="mobileNumber" class="form-control col mt-1">

							</div>
						</div>

						<div class="mb-3 row">
							<div class="col p-1">
								<label>Address</label> <input type="text" name="address" required
									class="form-control mt-1">
							</div>

							<div class="col p-1">
								<label>City</label> <input type="text" name="city" required
									class="form-control col mt-1">

							</div>
						</div>

						<div class="mb-3 row">
							<div class="col p-1">
								<label>State</label> <input type="text" name="state" required
									class="form-control mt-1">
							</div>

							<div class="col p-1">
								<label>Pincode</label> <input type="number" name="pincode" required
									class="form-control col mt-1">

							</div>
						</div>



				</div>


				<div class="col-md-6">
					<p class="text-center fs-2">Payment Type</p>
					<hr>

					<div class="card">
						<div class="card-body">
							<table class="table table-borderless">
								<tbody>
									<tr>
										<td>Price</td>
										<td>:</td>
										<td>&#8377; [[${orderPrice}]]</td>
									</tr>
									
									<tr>
										<td>Delivery Fee</td>
										<td>:</td>
										<td>&#8377; 250</td>
									</tr>
									
									<tr>
										<td>Tax</td>
										<td>:</td>
										<td>&#8377; 100</td>
									</tr>
									
									<tr class="border-top fw-bold">
										<td>Total Price</td>
										<td>:</td>
										<td>&#8377; [[${totalOrderPrice}]]</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>

					<div class="card shadow p-3 mb-5 mt-3 bg-body-tertiary rounded">

						<div class="card-body">
							<!-- <form action="/login" method="post"> -->
								<div class="mb-3">
									<label class="form-label">Select Payment Type</label> <select
										id="paymentType"
										class="form-control" name="paymentType">
										<option value="">-----Select-----</option>
										<option value="COD">Cash on Delivery</option>
										<option value="ONLINE">Online Payment</option>
									</select>
								</div>

								<input type="hidden" name="razorpayOrderId" id="razorpayOrderId">
								<input type="hidden" name="razorpayPaymentId" id="razorpayPaymentId">
								<input type="hidden" name="razorpaySignature" id="razorpaySignature">

								<button type="button" id="placeOrderBtn"
									class="btn bg-primary text-white col-md-12">Place
									Order</button>
							</div>
						</div>
					</div>
				</div>				
			</div>
			</form>
		</div>

		<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
		<script th:inline="javascript">
			document.getElementById('placeOrderBtn').addEventListener('click', function () {

				var $form = $('#orders');

				if (!$form.valid()) {
					return;
				}

				var paymentType = document.getElementById('paymentType').value;

				if (paymentType === '') {
					alert('Please select a payment type');
					return;
				}

				if (paymentType === 'COD') {
					$form.trigger('submit');
					return;
				}

				fetch('/user/create-razorpay-order', { method: 'POST' })
					.then(function (res) { return res.json(); })
					.then(function (data) {

						if (data.error) {
							alert(data.error);
							return;
						}

						var options = {
							key: data.key_id,
							amount: data.amount,
							currency: data.currency,
							name: 'ECommerce',
							description: 'Order Payment',
							order_id: data.order_id,
							prefill: {
								name: data.name,
								email: data.email,
								contact: data.contact
							},
							handler: function (response) {
								document.getElementById('razorpayOrderId').value = response.razorpay_order_id;
								document.getElementById('razorpayPaymentId').value = response.razorpay_payment_id;
								document.getElementById('razorpaySignature').value = response.razorpay_signature;
								$form.trigger('submit');
							}
						};

						var rzp = new Razorpay(options);
						rzp.open();
					})
					.catch(function () {
						alert('Unable to start payment. Please try again.');
					});
			});
		</script>

	</section>


</body>
</html>
