<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

	<section>

		<div class="container mt-5 Sp-5">
			<div class="row">
				<div class="col-md-6 p-5">
					<img alt="" src="img/delieveryBoy1.jpg" width="100%" height="400px">
				</div>
				<div class="col-md-6 mt-3 p-5">
					<div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-header">
							<p class="fs-4 text-center">Forgot Password</p>

							<div th:if="${param.error}"
								class="alert alert-danger text-center">	
								[[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]
							</div>
								
								 <div th:if="${param.error}"
								class="alert alert-danger text-center">
								</div>

							
								
								<th:block th:if="${session.successMsg}">
								<p class="text-success fw-bold text-center">[[${session.successMsg}]]</p>
								<th:block th:text=${@commonServiceImpl.removeSessionMsg()}></th:block>
							</th:block>
							
							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold text-center">[[${session.errorMsg}]]</p>
								<th:block th:text=${@commonServiceImpl.removeSessionMsg()}></th:block>
							</th:block>

						</div>
						<div class="card-body">
							<form action="/forgot-password" method="post">
								<div class="mb-3">
									<label class="form-label">Email</label> <input required
										class="form-control" name="email" type="email"
										placeholder="Enter your email">
								</div>


								<div class="text-center">
									<button type="submit" class="btn bg-primary text-white">Send</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>

	</section>


</body>
</html>
