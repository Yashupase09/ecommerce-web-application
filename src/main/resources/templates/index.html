<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>

		<!-- Start Slider -->

		<div id="carouselExample" class="carousel slide mt-2 pt-5" data-bs-ride="carousel" data-bs-interval="3000">
			<div class="carousel-inner ">
				<div class="carousel-item active">
					<img src="img/banner12.webp" class="d-block w-100" alt="..."
						height="250px" width="100%">
				</div>
				<div class="carousel-item">
					<img src="img/banner13.png" class="d-block w-100" alt="..."
						height="250px" width="100%">
				</div>
				<div class="carousel-item">
					<img src="img/banner11.webp" class="d-block w-100" alt="..."
						height="250px" width="100%">
				</div>
			</div>
			<button class="carousel-control-prev" type="button"
				data-bs-target="#carouselExample" data-bs-slide="prev">
				<span class="carousel-control-prev-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Previous</span>
			</button>
			<button class="carousel-control-next" type="button"
				data-bs-target="#carouselExample" data-bs-slide="next">
				<span class="carousel-control-next-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Next</span>
			</button>
		</div>

		<!-- End Slider -->

		<!-- Start Category Section  -->

		<div class="container mt-1">
			<div class="row">
				<p class="text-center fs-4">SHOP BY CATEGORY</p>
				<div class="col-md-2 p-3 text-center" th:each="c : ${category}">
				 <a th:href="@{'/products?category=' + ${c.name}}" style="text-decoration: none; color: inherit;">
					<img th:src="@{'img/category_img/' + ${c.imageName}}"
						alt="Category Image"
						style="width: 140px; height: 140px; border-radius: 50%; object-fit: cover;">
					<p class="mt-2 fw-semibold">[[${c.name}]]</p>
					</a>
				</div>
			</div>
		</div>
